[functions."sync-rakuten-background"]
  schedule = "@daily"

# サイト本体(index.htmlなど)はGitHub Pagesで公開しており、
# このNetlifyプロジェクトはnetlify/functions配下のAPIのみを提供する。
# netlify/ 以下に変更がないpushでは、無駄なビルド・デプロイを行わない
# （＝クレジットを消費しない）ようにする。
[build]
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- netlify/"
