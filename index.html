<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DESTINA — 写真でめぐる、最高のホテル体験</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,450;0,9..144,600;0,9..144,900;1,9..144,450&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --void:#0F1210;
    --void-2:#171B18;
    --void-3:#1F2420;
    --paper:#F6F3EC;
    --paper-dim:#DAD4C4;
    --brass:#C9A15A;
    --brass-soft:rgba(201,161,90,0.16);
    --moss:#5B6E52;
    --stone:#9C9284;
    --clay:#B65C3D;
    --line:rgba(246,243,236,0.12);
    --line-soft:rgba(246,243,236,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--void);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{ background:var(--brass-soft); color:var(--paper); }
  .serif{ font-family:'Fraunces', serif; }
  .mono{ font-family:'IBM Plex Mono', monospace; letter-spacing:0.02em; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }

  /* ---------- top nav ---------- */
  .nav{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 24px;
    background:rgba(15,18,16,0.86);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line-soft);
  }
  .logo{ display:flex; flex-direction:column; line-height:1; }
  .logo .mark{ font-size:21px; font-weight:900; letter-spacing:0.04em; font-style:normal; text-transform:uppercase; }
  .logo .sub{ font-family:'Inter',sans-serif; font-size:10.5px; letter-spacing:0.04em; color:var(--stone); margin-top:6px; font-weight:600; }
  .tabs{ display:flex; gap:2px; background:var(--void-2); padding:4px; border-radius:999px; border:1px solid var(--line-soft); }
  .tab-btn{
    background:transparent; border:none; color:var(--stone);
    font-size:12.5px; padding:8px 16px; border-radius:999px;
    letter-spacing:0.03em; transition:all .25s ease;
    white-space:nowrap;
  }
  .tab-btn.active{ background:var(--paper); color:var(--void); box-shadow:0 0 0 1.5px var(--brass); font-weight:600; }
  .fav-count{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:16px; height:16px; padding:0 4px; margin-left:6px;
    background:var(--brass); color:var(--void); border-radius:999px;
    font-size:10px; font-weight:600; font-family:'IBM Plex Mono',monospace;
    vertical-align:middle;
  }

  /* ---------- nav: keep logo + tabs on one line on narrow phones ---------- */
  @media (max-width:480px){
    .nav{ padding:12px 10px; gap:8px; }
    .logo{ flex:none; }
    .logo .mark{ font-size:15px; }
    .logo .sub{ display:none; }
    .tabs{ gap:0; flex:none; max-width:100%; }
    .tab-btn{ font-size:10px; padding:6px 8px; }
    .fav-count{ min-width:13px; height:13px; padding:0 3px; margin-left:3px; font-size:8.5px; }
  }
  @media (max-width:360px){
    .tab-btn{ font-size:9px; padding:5px 6px; }
    .logo .mark{ font-size:13px; }
  }

  /* ---------- filter chips ---------- */
  .filters-wrap{
    display:flex; align-items:center; gap:2px;
    max-width:640px; margin:0 auto; padding:16px 12px 4px;
  }
  .filters{
    display:flex; gap:8px; overflow-x:auto; scroll-behavior:smooth;
    scrollbar-width:none; flex:1; min-width:0; padding:2px 2px;
  }
  .filters::-webkit-scrollbar{ display:none; }
  .filter-arrow{
    flex:none; width:24px; height:24px; border-radius:50%; border:none;
    background:rgba(246,243,236,0.07); color:var(--stone);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; transition:all .2s ease;
  }
  .filter-arrow:hover{ background:rgba(246,243,236,0.16); color:var(--paper); }
  .chip{
    flex:none; background:transparent; border:1px solid var(--line);
    color:var(--paper-dim); font-size:12px; padding:7px 14px; border-radius:999px;
    white-space:nowrap; transition:all .2s ease;
  }
  .chip.active{ background:var(--paper); color:var(--void); border-color:var(--brass); box-shadow:0 0 0 1.5px var(--brass); font-weight:600; }

  .sort-wrap{
    display:flex; align-items:flex-start; justify-content:flex-start; gap:24px;
    max-width:640px; margin:0 auto; padding:2px 12px 20px; position:relative; flex-wrap:wrap;
    border-bottom:1px solid var(--line-soft);
  }
  .stay-col{ display:flex; flex-direction:column; align-items:flex-start; gap:6px; }
  .stay-filter{
    display:flex; align-items:center; gap:6px; background:var(--void-2);
    border:1px solid var(--line); border-radius:999px; padding:5px 8px 5px 14px;
  }
  .stay-label{ font-size:11px; color:var(--stone); font-family:'IBM Plex Mono',monospace; letter-spacing:0.03em; }
  .stay-input{
    background:transparent; color:var(--paper); border:none; font-size:11.5px;
    font-family:'IBM Plex Mono',monospace; padding:4px 2px; color-scheme:dark; max-width:118px;
  }
  .stay-input:focus{ outline:none; }
  .stay-arrow{ color:var(--stone); font-size:11px; }
  .stay-reset{
    color:var(--clay); font-size:10.5px; border:1px solid var(--line);
    border-radius:999px; padding:5px 11px; white-space:nowrap;
  }
  .stay-reset:hover{ color:var(--brass); border-color:var(--brass); }
  .stay-search{
    color:var(--void); background:var(--brass); font-size:10.5px; font-weight:600;
    border:1px solid var(--brass); border-radius:999px; padding:5px 13px; white-space:nowrap;
    transition:opacity .2s ease;
  }
  .stay-search:hover{ opacity:0.85; }
  .stay-search:disabled{
    background:transparent; color:var(--stone); border-color:var(--line); cursor:default; opacity:0.6;
  }
  .pref-filter{ position:relative; }
  .pref-filter-btn{
    background:var(--void-2); color:var(--paper); border:1px solid var(--line);
    border-radius:999px; padding:7px 16px; font-size:12px; font-family:inherit;
    display:flex; align-items:center; gap:6px; transition:border-color .2s ease;
  }
  .pref-filter-btn::after{
    content:''; width:0; height:0; margin-left:2px;
    border-left:4px solid transparent; border-right:4px solid transparent;
    border-top:5px solid var(--stone);
  }
  .pref-filter-btn.active{ border-color:var(--brass); color:var(--brass); background:var(--brass-soft); box-shadow:0 0 0 1.5px var(--brass); }
  .pref-filter-btn.active::after{ border-top-color:var(--brass); }
  .pref-panel{
    display:none; position:absolute; top:calc(100% + 8px); right:0; z-index:50;
    width:240px; max-height:320px; overflow-y:auto;
    background:var(--void-2); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 12px 32px rgba(0,0,0,0.45); padding:10px;
  }
  .pref-panel.open{ display:block; }
  .pref-panel-head{
    display:flex; align-items:center; justify-content:space-between;
    font-size:10.5px; color:var(--stone); letter-spacing:0.03em;
    padding:2px 4px 8px; border-bottom:1px solid var(--line-soft); margin-bottom:6px;
  }
  .pref-panel-clear{ color:var(--clay); font-size:10.5px; }
  .pref-panel-clear:hover{ color:var(--brass); }
  .pref-panel-list{ display:flex; flex-direction:column; }
  .pref-item{
    display:flex; align-items:center; gap:9px; padding:7px 6px; border-radius:8px;
    font-size:12.5px; transition:background .15s ease;
  }
  .pref-item:hover{ background:rgba(246,243,236,0.05); }
  .pref-item .box{
    flex:none; width:15px; height:15px; border-radius:4px; border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; transition:all .15s ease;
  }
  .pref-item.checked{ background:var(--brass-soft); border-left:2px solid var(--brass); padding-left:4px; }
  .pref-item.checked .box{ background:var(--brass); border-color:var(--brass); }
  .pref-item.checked .box::after{ content:'✓'; font-size:10px; color:var(--void); line-height:1; }
  .pref-item .cnt{ margin-left:auto; font-size:10px; color:var(--stone); font-family:'IBM Plex Mono',monospace; }
  .occ-filter{
    display:flex; align-items:center; gap:8px; background:var(--void-2);
    border:1px solid var(--line); border-radius:999px; padding:5px 10px 5px 14px;
  }
  .occ-step{
    flex:none; width:20px; height:20px; border-radius:50%; border:1px solid var(--line);
    background:transparent; color:var(--paper-dim); font-size:13px; line-height:1;
    display:flex; align-items:center; justify-content:center; transition:all .2s ease;
  }
  .occ-step:hover{ border-color:var(--brass); color:var(--brass); }
  .occ-count{ font-size:12.5px; min-width:14px; text-align:center; }
  .occ-unit{ font-size:11px; color:var(--stone); white-space:nowrap; }
  .stay-loading{ font-size:11px; color:var(--stone); font-family:'IBM Plex Mono',monospace; padding:2px 4px 10px; letter-spacing:0.02em; grid-column:1 / -1; }
  .feed-banners{ grid-column:1 / -1; }
  .feed-banners:empty{ display:none; }
  .api-error-banner{
    background:rgba(182,92,61,0.12); border:1px solid var(--clay); border-radius:12px;
    padding:14px 16px; margin-bottom:20px; font-size:12.5px; line-height:1.7; color:var(--paper-dim);
    grid-column:1 / -1;
  }
  .api-error-banner strong{ color:var(--clay); }
  .api-error-detail{ margin-top:6px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--stone); }
  .stay-hint{ flex:1 1 100%; max-width:none; margin:2px 0 0; padding:0 4px; font-size:10.5px; line-height:1.5; color:var(--stone); text-align:left; }

  /* ---------- feed ---------- */
  .feed{ max-width:640px; margin:0 auto; padding:16px 20px 80px; }

  @media (min-width:880px){
    .filters-wrap{ max-width:1180px; }
    .sort-wrap{ max-width:1180px; }
    .feed{ max-width:1180px; }
    #cardList{ display:grid; grid-template-columns:1fr 1fr; column-gap:40px; row-gap:8px; }
    .card{ margin-bottom:52px; }
  }
  .intro-wrap{ max-width:640px; margin:0 auto; padding:0 20px; }
  @media (min-width:880px){ .intro-wrap{ max-width:1180px; } }
  .intro{ padding:20px 0 22px; border-bottom:1px solid var(--line-soft); margin-bottom:6px; }
  .intro h1{ font-size:26px; font-weight:450; margin:0 0 8px; line-height:1.35; }
  .intro p{ font-size:13px; color:var(--stone); margin:0; line-height:1.7; }

  .card{ margin-bottom:44px; }
  .card-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; padding:0 2px;}
  .card-name{ font-size:20px; font-weight:450; cursor:pointer; }
  .card-name:hover{ color:var(--brass); }
  .card-loc{ font-size:11px; color:var(--stone); margin-top:5px; }
  .card-loc .dot{ margin:0 6px; opacity:0.5; }

  .stamp{
    flex:none; width:38px; height:38px; border-radius:50%;
    border:1.5px dashed var(--line); background:transparent;
    display:flex; align-items:center; justify-content:center;
    position:relative; transition:all .25s ease;
  }
  .stamp svg{ width:15px; height:15px; }
  .stamp path{ stroke:var(--stone); fill:none; stroke-width:1.6; transition:all .25s ease; }
  .stamp.active{ border-color:var(--brass); border-style:solid; background:var(--brass-soft); }
  .stamp.active path{ stroke:var(--brass); fill:var(--brass); }

  .gallery-wrap{ position:relative; }
  .gallery{
    display:flex; gap:6px; overflow-x:auto; scroll-snap-type:x mandatory;
    border-radius:2px; scrollbar-width:none; touch-action:pan-y;
  }
  .gallery::-webkit-scrollbar{ display:none; }
  .frame{
    position:relative; flex:none; scroll-snap-align:start; scroll-snap-stop:always;
    width:100%; aspect-ratio:3/2; overflow:hidden; background:var(--void-2);
  }
  .frame:not(:first-child){ width:78%; aspect-ratio:3/2; }
  .frame img{ width:100%; height:100%; object-fit:cover; display:block; }
  .frame-art{ width:100%; height:100%; position:relative; overflow:hidden; }
  .frame-photo{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:1;
  }
  .frame-art::after{
    content:''; position:absolute; inset:0;
    background-image:var(--grain);
    mix-blend-mode:overlay; opacity:0.5; pointer-events:none;
  }
  .frame-art::before{
    content:''; position:absolute; inset:0;
    background:radial-gradient(120% 90% at 78% 8%, rgba(255,255,255,0.30), transparent 55%),
               radial-gradient(90% 70% at 12% 96%, rgba(0,0,0,0.35), transparent 60%);
    pointer-events:none;
  }
  .frame-cap{
    position:absolute; left:10px; bottom:9px; font-size:10px; letter-spacing:0.02em;
    color:var(--paper); text-shadow:0 1px 6px rgba(0,0,0,0.5); z-index:2; max-width:75%;
  }
  .frame-idx{
    position:absolute; bottom:9px; right:10px; font-size:9.5px;
    color:var(--paper); background:rgba(15,18,16,0.55); backdrop-filter:blur(3px);
    padding:2px 7px; border-radius:20px; font-family:'IBM Plex Mono',monospace; letter-spacing:0.04em;
    z-index:2;
  }
  .sprocket{
    position:absolute; top:0; left:0; right:0; height:5px;
    background-image:repeating-linear-gradient(90deg, var(--void) 0 3px, transparent 3px 9px);
    opacity:0.55; z-index:2;
  }

  .gallery-arrow{
    position:absolute; top:50%; transform:translateY(-50%); z-index:5;
    width:32px; height:32px; border-radius:50%; border:none;
    background:rgba(15,18,16,0.32); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center;
    opacity:0.75; transition:opacity .2s ease, background .2s ease;
  }
  .gallery-arrow:hover{ opacity:1; background:rgba(15,18,16,0.5); }
  .gallery-arrow.left{ left:8px; }
  .gallery-arrow.right{ right:8px; }
  .gallery-arrow svg{ width:9px; height:9px; }
  .gallery-arrow polygon{ fill:rgba(246,243,236,0.85); }

  .card-foot{ display:flex; justify-content:space-between; align-items:center; padding:12px 2px 0; }
  .price{ font-family:'IBM Plex Mono',monospace; font-size:13.5px; }
  .price .from{ color:var(--stone); font-size:10.5px; margin-left:3px;}
  .price-status.status-live{ color:var(--moss); font-weight:600; }
  .price-status.status-checking{ color:var(--brass); }
  .price-status.status-unchecked{ color:var(--clay); }
  .price-status.status-failed{ color:var(--clay); }
  .rating{ font-size:11px; color:var(--stone); margin-left:12px; }
  .rating b{ color:var(--paper); font-weight:500; }
  .detail-link{
    font-size:11.5px; color:var(--brass); display:flex; align-items:center; gap:4px;
    border-bottom:1px solid transparent;
  }
  .detail-link:hover{ border-color:var(--brass); }
  .card-actions{ display:flex; align-items:center; gap:14px; }
  .book-link{
    font-size:11.5px; color:var(--void); background:var(--brass); font-weight:600;
    display:flex; align-items:center; gap:4px; padding:7px 13px; border-radius:999px;
    transition:opacity .2s ease;
  }
  .book-link:hover{ opacity:0.85; }

  /* ---------- modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(8,9,8,0.72); backdrop-filter:blur(4px);
    z-index:2000; display:none; align-items:flex-end; justify-content:center;
  }
  .overlay.open{ display:flex; }
  .modal{
    background:var(--void-2); width:100%; max-width:640px; max-height:92vh; overflow-y:auto;
    border-radius:18px 18px 0 0; border:1px solid var(--line-soft); border-bottom:none;
    animation:rise .35s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise{ from{ transform:translateY(24px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
  .modal-hero{ position:relative; width:100%; aspect-ratio:4/3; overflow:hidden; }
  .modal-hero img{ width:100%; height:100%; object-fit:cover; }
  .modal-hero .frame-art{ position:absolute; inset:0; }
  .modal-close{
    position:absolute; top:16px; right:16px; width:34px; height:34px; border-radius:50%;
    background:rgba(15,18,16,0.6); backdrop-filter:blur(6px); border:1px solid var(--line);
    color:var(--paper); font-size:16px; display:flex; align-items:center; justify-content:center;
  }
  .modal-body{ padding:26px 26px 40px; }
  .modal-eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.18em; color:var(--brass); text-transform:uppercase; }
  .modal-title{ font-size:28px; margin:8px 0 4px; }
  .modal-loc{ color:var(--stone); font-size:12.5px; margin-bottom:20px;}
  .modal-desc{ font-size:13.5px; line-height:1.9; color:var(--paper-dim); margin-bottom:22px; }

  .tag-row{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:24px; }
  .tag{ font-size:10.5px; border:1px solid var(--line); color:var(--stone); padding:5px 11px; border-radius:999px; }

  .stat-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line-soft); border:1px solid var(--line-soft); border-radius:10px; overflow:hidden; margin-bottom:24px; }
  .stat{ background:var(--void); padding:14px 10px; text-align:center; }
  .stat .v{ font-family:'IBM Plex Mono',monospace; font-size:15px; color:var(--brass); }
  .stat .l{ font-size:9.5px; color:var(--stone); margin-top:5px; letter-spacing:0.04em; }

  .map-box{
    position:relative; height:170px; border-radius:12px; overflow:hidden; margin-bottom:24px;
    border:1px solid var(--line-soft); background:var(--void-3);
  }
  .map-box iframe{ width:100%; height:100%; border:0; display:block; filter:grayscale(0.15) contrast(1.05); }
  .map-coord{ position:absolute; bottom:10px; left:12px; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--paper-dim); background:rgba(15,18,16,0.6); padding:3px 8px; border-radius:5px; pointer-events:none; z-index:2; }

  .modal-actions{ display:flex; gap:10px; }
  .btn{
    flex:1; text-align:center; padding:14px; border-radius:10px; font-size:13px; font-weight:500;
    display:flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--line);
  }
  .btn-primary{ background:var(--brass); color:var(--void); border-color:var(--brass); }
  .btn-ghost{
    flex:0 0 52px; height:52px; padding:0; border-radius:50%;
    border:1.5px dashed var(--line); background:transparent;
    color:var(--stone);
  }
  .btn-ghost svg{ width:18px; height:18px; }
  .btn-ghost path{ stroke:var(--stone); fill:none; stroke-width:1.6; transition:all .25s ease; }
  .btn-ghost:hover{ border-color:var(--paper-dim); }
  .btn-ghost:hover path{ stroke:var(--paper); }
  .btn-ghost.active{ border-color:var(--brass); border-style:solid; background:var(--brass-soft); }
  .btn-ghost.active path{ stroke:var(--brass); fill:var(--brass); }

  /* ---------- compare page ---------- */
  .compare-wrap{ max-width:1180px; margin:0 auto; padding:28px 20px 80px; }
  .compare-head h1{ font-size:24px; margin:0 0 6px; font-weight:450; }
  .compare-head p{ font-size:12.5px; color:var(--stone); margin:0 0 26px; }
  .empty{ text-align:center; padding:80px 20px; border:1px dashed var(--line); border-radius:16px; }
  .empty .ico{ font-size:26px; margin-bottom:14px; }
  .empty p{ color:var(--stone); font-size:13px; margin:0 0 18px; }
  .empty button{ background:var(--paper); color:var(--void); border:none; padding:11px 22px; border-radius:999px; font-size:12.5px; }

  /* ---------- map view ---------- */
  .map-wrap{ max-width:1180px; margin:0 auto; padding:28px 20px 80px; }
  #favMap{
    width:100%; height:70vh; min-height:420px; border-radius:16px;
    border:1px solid var(--line-soft); background:var(--void-2); overflow:hidden;
  }
  .leaflet-popup-content-wrapper{
    background:var(--void-2); color:var(--paper); border-radius:12px;
    border:1px solid var(--line); box-shadow:0 8px 28px rgba(0,0,0,0.4);
  }
  .leaflet-popup-content{ margin:0; width:200px !important; }
  .leaflet-popup-tip{ background:var(--void-2); }
  .leaflet-container a.leaflet-popup-close-button{ color:var(--stone); }
  .map-pop{ display:flex; flex-direction:column; }
  .map-pop-photo{ width:100%; height:110px; border-radius:12px 12px 0 0; overflow:hidden; position:relative; }
  .map-pop-photo img{ width:100%; height:100%; object-fit:cover; display:block; position:relative; z-index:1; }
  .map-pop-body{ padding:10px 12px 12px; }
  .map-pop-name{ font-family:'Fraunces',serif; font-size:14px; margin-bottom:3px; cursor:pointer; }
  .map-pop-name:hover{ color:var(--brass); }

  '新潟','富山','石川','福井','山梨','長野',
  '岐阜','静岡','愛知','三重',
  '滋賀','京都','大阪','兵庫','奈良','和歌山',
  '鳥取','島根','岡山','広島','山口',
  '徳島','香川','愛媛','高知',
  '福岡','佐賀','長崎','熊本','大分','宮崎','鹿児島','沖縄'
];
function getPref(region){
  if(!region) return 'その他';
  const head = region.split('・')[0];
  const found = PREF_ORDER.find(p => head.startsWith(p) || region.startsWith(p));
  return found || head;
}
let stayDates = { checkin:'', checkout:'' };
let currentModalId = null;
let activePrefs = new Set();
let occupancy = 2; // 大人の人数（1部屋あたり）。人数ボタンで変更可能。

// ==== 楽天トラベル空室検索API（VacantHotelSearch）連携 ====
// 楽天ウェブサービスの「アプリケーションID」をここに設定してください。
// 取得先: https://webservice.rakuten.co.jp/ （無料登録後、マイページで発行できます）
// このIDはクライアント側のコードに直接埋め込む前提のものです（サーバー保存が必要な秘密鍵ではありません）。
const RAKUTEN_APP_ID = '9cca85e7-0b44-4cfe-aa6e-f8ec3d2fd089';
// このアプリ（Destina）は新しいRakuten Developersのアプリ登録形式（ドメイン制限つき）で発行されており、
// applicationIdだけでなく、対になるaccessKeyも一緒に送らないと「invalid applicationId」として弾かれる。
// Allowed websitesでドメインが制限されている前提のキーなので、クライアント側に埋め込む想定のもの。
const RAKUTEN_ACCESS_KEY = 'pk_WUVzRNkpBSD1gzQekoj6UURjoLp7EWPWCPQKisg3lwQ';

// h.bookingUrl（楽天アフィリエイトリンク）に埋め込まれた楽天トラベルの施設番号(hotelNo)を取り出す
function extractHotelNo(h){
  if(!h.bookingUrl) return null;
  const m = h.bookingUrl.match(/HOTEL%2F(\d+)%2F/) || h.bookingUrl.match(/HOTEL\/(\d+)\//);
  return m ? m[1] : null;
}

// 楽天のAPIはCORS非対応のため、JSONP（callbackパラメータ＋scriptタグ）でブラウザから直接呼び出す
let jsonpSeq = 0;
function jsonpRequest(url){
  return new Promise((resolve, reject) => {
    const cbName = 'rakutenJsonp_' + (jsonpSeq++) + '_' + Date.now();
    const script = document.createElement('script');
    let settled = false;
    const cleanup = () => {
      delete window[cbName];
      if(script.parentNode) script.parentNode.removeChild(script);
    };
    window[cbName] = (data) => { settled = true; cleanup(); resolve(data); };
    script.onerror = () => { if(!settled){ settled = true; cleanup(); reject(new Error('jsonp load error')); } };
    script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
    document.body.appendChild(script);
    setTimeout(() => { if(!settled){ settled = true; cleanup(); reject(new Error('jsonp timeout')); } }, 8000);
  });
}

// hotelNo × 宿泊日 × 人数 の組み合わせごとに空室有無をキャッシュ
// 値: true=空室あり / false=空室なし / null=取得失敗（不明。誤って非表示にしないため表示は残す）
let availabilityCache = {};
let availabilityLoading = false;

// hotelNo × 宿泊日 × 人数 の組み合わせごとに「その条件での最安料金」をキャッシュ
// 値: 数値=楽天APIが返した最安料金(hotelMinCharge) / null=取得失敗・該当プランなし
let priceCache = {};

function availabilityKey(hotelNo){
  return [hotelNo, stayDates.checkin, stayDates.checkout, occupancy].join('|');
}

// 楽天VacantHotelSearchのレスポンスから、その検索条件における最安料金(hotelMinCharge)を取り出す
// 楽天VacantHotelSearchのレスポンスから、実際に検索した日程・人数でヒットしたプランの
// 「宿泊全泊分の合計金額」の最安値を取り出す。
// 注意: hotelBasicInfo.hotelMinCharge は日程に関わらない施設の一般的な参考最安値であり、
// 検索した日程の実料金とは異なることがある（例: 常に同じ値を返す）ため、使用しない。
// 代わりに、返ってきた各room Info（部屋・プランごと）の dailyCharge.total（1泊ごとの金額）を
// 宿泊日数分すべて合算し、その中の最安値を採用する。
function extractMinCharge(data){
  try{
    const hotelArr = data.hotels[0].hotel;
    let min = null;
    for(let i=1; i<hotelArr.length; i++){
      const roomInfo = hotelArr[i] && hotelArr[i].roomInfo;
      if(!Array.isArray(roomInfo)) continue;
      let nightsTotal = 0;
      let hasCharge = false;
      roomInfo.forEach(entry => {
        const dc = entry && entry.dailyCharge;
        if(dc && typeof dc.total === 'number'){
          nightsTotal += dc.total;
          hasCharge = true;
        }
      });
      if(hasCharge && (min === null || nightsTotal < min)) min = nightsTotal;
    }
    if(min !== null) return min;
    // フォールバック: プラン別の内訳が取得できない場合のみ、施設の参考最安値を使う
    const charge = data.hotels[0].hotel[0].hotelBasicInfo.hotelMinCharge;
    return (typeof charge === 'number') ? charge : null;
  } catch(e){ return null; }
}

// APIから返ってきた最新のエラー内容（開発者ツールを開かなくても画面上で理由が分かるように保持する）
let lastApiError = null;

async function fetchVacancy(hotelNo){
  const key = availabilityKey(hotelNo);
  if(key in availabilityCache) return availabilityCache[key];
  const url = 'https://openapi.rakuten.co.jp/engine/api/Travel/VacantHotelSearch/20170426'
    + '?format=json&applicationId=' + encodeURIComponent(RAKUTEN_APP_ID)
    + '&accessKey=' + encodeURIComponent(RAKUTEN_ACCESS_KEY)
    + '&hotelNo=' + encodeURIComponent(hotelNo)
    + '&checkinDate=' + stayDates.checkin
    + '&checkoutDate=' + stayDates.checkout
    + '&adultNum=' + occupancy;
  try{
    // 新しいopenapi.rakuten.co.jp側は「許可したウェブサイトのオリジンからのCORSアクセス」を
    // 前提にした仕組みのため、<script>タグ経由のJSONP（Originヘッダーが付かない）ではなく、
    // 通常のfetch（ブラウザが自動でOriginヘッダーを付与する）で呼び出す。
    const res = await fetch(url);
    const data = await res.json();
    // 楽天APIはアプリケーションIDが無効・期限切れ等の場合、hotels配列ではなく
    // {error, error_description} 形式のエラーレスポンスを200 OKで返してくることがある。
    // これを「空室なし」と誤判定すると、本来は空室があるかもしれないホテルまで
    // 一覧から消えてしまうため、エラーレスポンスは「不明（null）」として扱い、
    // 一覧からは非表示にしない。
    if(data && data.error){
      console.warn('Rakuten API error for hotelNo ' + hotelNo + ':', data.error, data.error_description);
      lastApiError = (data.error_description || data.error);
      availabilityCache[key] = null;
      priceCache[key] = null;
      return null;
    }
    const available = !!(data && Array.isArray(data.hotels) && data.hotels.length > 0);
    availabilityCache[key] = available;
    priceCache[key] = available ? extractMinCharge(data) : null;
    return available;
  } catch(e){
    lastApiError = '通信エラー（' + e.message + '）';
    availabilityCache[key] = null;
    priceCache[key] = null;
    return null;
  }
}

// 表示用の料金を返す。宿泊日が選択され、かつその日付での楽天の最安料金が取得できていればそれを優先し、
// 取得できていない（未検索・失敗・該当なし）場合は埋め込みの基準価格にフォールバックする。
function getDisplayPrice(h){
  if(stayDates.checkin && stayDates.checkout){
    const hotelNo = extractHotelNo(h);
    if(hotelNo){
      const key = availabilityKey(hotelNo);
      if(key in priceCache && priceCache[key] !== null && priceCache[key] !== undefined){
        return priceCache[key];
      }
    }
  }
  return h.price;
}

// 表示中の価格が「選択日で実際に確認できた楽天の料金」なのか、それ以外（検索前の目安、
// もしくはこの施設だけ確認に失敗した目安）なのかを判定する。
// 'live'       : 選択日・人数での楽天の実料金が取得できている
// 'checking'   : 選択日はあるが、このホテルの確認がまだ完了していない（検索中）
// 'unchecked'  : 選択日はあるが、まだ「検索」ボタンが押されていない（未検索）
// 'failed'     : 選択日で検索したが、このホテルはAPIエラー等で確認できなかった（目安を表示中）
// 'none'       : 宿泊日が選択されていない
function priceStatus(h){
  if(!(stayDates.checkin && stayDates.checkout)) return 'none';
  const hotelNo = extractHotelNo(h);
  if(!hotelNo) return 'failed';
  const key = availabilityKey(hotelNo);
  if(key in priceCache && priceCache[key] !== null && priceCache[key] !== undefined) return 'live';
  if(key in availabilityCache) return 'failed'; // 確認は完了したが、料金が取れなかった／エラーだった
  if(availabilityLoading) return 'checking';
  return 'unchecked';
}
function priceStatusLabel(h, short){
  const s = priceStatus(h);
  if(s==='live') return short ? '選択日の料金' : '〜 / 泊・選択日の楽天料金';
  if(s==='checking') return short ? '確認中…' : '〜 / 泊・この日程を確認中…';
  if(s==='unchecked') return short ? '目安（未検索）' : '〜 / 泊・目安料金（「検索」を押すと選択日の料金を確認します）';
  if(s==='failed') return short ? '目安（未確認）' : '〜 / 泊・目安料金（この日程は確認できませんでした）';
  return short ? '' : '〜 / 泊';
}

// 現在選択中の宿泊日・人数で、表示中の全ホテルの空室を確認しながら都度再描画する。
// 以前は1件ずつ順番に確認していたため（79件 × 通信時間+200ms待機）検索完了までに
// かなり時間がかかっていた。少数ずつ並行して確認することで、楽天APIへの
// 同時アクセス数は抑えつつ全体の待ち時間を大きく縮める。
let availabilityRunId = 0;
let allChecksFailed = false; // 検索した全件がAPIエラー等で確認できなかった場合にtrue（applicationId不正などの合図）
const AVAILABILITY_CONCURRENCY = 5;
async function refreshAvailabilityAndRender(){
  if(!stayDates.checkin || !stayDates.checkout){
    availabilityLoading = false;
    renderFeed();
    return;
  }
  const runId = ++availabilityRunId;
  availabilityLoading = true;
  lastApiError = null;
  allChecksFailed = false;
  renderFeed();

  const targets = HOTELS
    .map(h => extractHotelNo(h))
    .filter(hotelNo => hotelNo && !(availabilityKey(hotelNo) in availabilityCache));

  let attempted = 0, failed = 0;
  let cursor = 0;

  // 確認結果が数件まとまってから一度だけ再描画する（1件ごとの再描画による
  // カクつきを防ぐため、次の描画フレームまでの分をまとめてコミットする）
  let renderScheduled = false;
  function scheduleRender(){
    if(renderScheduled) return;
    renderScheduled = true;
    requestAnimationFrame(() => {
      renderScheduled = false;
      if(runId === availabilityRunId) renderFeed();
    });
  }

  async function worker(){
    while(cursor < targets.length){
      if(runId !== availabilityRunId) return;
      const hotelNo = targets[cursor++];
      const result = await fetchVacancy(hotelNo);
      attempted++;
      if(result === null) failed++;
      if(runId !== availabilityRunId) return;
      scheduleRender();
    }
  }

  const workerCount = Math.min(AVAILABILITY_CONCURRENCY, targets.length);
  await Promise.all(Array.from({ length: workerCount }, worker));

  if(runId === availabilityRunId){
    availabilityLoading = false;
    allChecksFailed = attempted > 0 && failed === attempted;
    renderFeed();
  }
}

  document.getElementById('occCount').textContent = occupancy;

function setStayDates(fromCheckin){
  const ci = document.getElementById('checkinInput').value;
  const co = document.getElementById('checkoutInput').value;
  if(ci){
    const next = new Date(ci+'T00:00:00');
    next.setDate(next.getDate()+1);
    document.getElementById('checkoutInput').min = next.toISOString().slice(0,10);
  }
  // チェックイン日を選んだ直後は、チェックアウト日のカレンダーを続けて自動的に開き、
  // 「閉じる→また開く」という手間を無くして連続で選択できるようにする。
  // （非対応ブラウザではshowPickerが存在しないため、安全に無視する）
  if(fromCheckin && ci && !co){
    const coInput = document.getElementById('checkoutInput');
    if(typeof coInput.showPicker === 'function'){
      try{ coInput.showPicker(); } catch(e){}
    }
  }
  if(ci && co && co <= ci){
    alert('チェックアウト日はチェックイン日より後の日付を選んでください。');
    document.getElementById('checkoutInput').value = '';
    stayDates.checkin = ci; stayDates.checkout = '';
    return;
  }
  stayDates.checkin = ci; stayDates.checkout = co;
  // 日付を選んだだけでは検索を開始しない。「検索」ボタンが押せる状態にするだけにして、

  availabilityLoading = false;
  updateSearchButtonState();
  renderFeed();
  if(currentModalId && document.getElementById('overlay').classList.contains('open')) openModal(currentModalId, true);
  if(document.getElementById('comparePage').style.display !== 'none') renderCompare();
}

  document.getElementById('checkoutInput').value = '';
  availabilityLoading = false;
  availabilityRunId++; // 進行中の検索があれば中断する

  lastApiError = null;

function updateSearchButtonState(){

// 選択中の宿泊日があれば、楽天トラベルのアフィリエイトリンク（pcパラメータ内のURL）に
// チェックイン/チェックアウト日を埋め込んで、その日付での空室確認に直接ジャンプできるようにする
function buildBookingUrl(h){
  const base = h.bookingUrl || ('https://travel.rakuten.co.jp/dsearch/?f_keyword=' + encodeURIComponent(h.name+' '+h.region));
  if(!stayDates.checkin || !stayDates.checkout) return base;
  try{
    const ci = new Date(stayDates.checkin+'T00:00:00');
    const co = new Date(stayDates.checkout+'T00:00:00');
    const wrapUrl = new URL(base);
    const pcRaw = wrapUrl.searchParams.get('pc');
    if(!pcRaw) return base;
    // 元のpc URL（例: https://travel.rakuten.co.jp/HOTEL/13417/13417.html）からホテル番号を抽出し、
    // 検索結果（プラン一覧）ページへ直接ジャンプするURLを組み立てる
    const m = pcRaw.match(/\/HOTEL\/(\d+)\//);
    if(!m) return base; // ホテル番号が取れない場合は従来どおりトップページへ
    const hotelNo = m[1];
    const target = new URL(`https://hotel.travel.rakuten.co.jp/hotelinfo/plan/${hotelNo}`);
    target.searchParams.set('f_flg', 'PLAN');
    target.searchParams.set('f_static', '1');
    target.searchParams.set('f_nen1', ci.getFullYear());
    target.searchParams.set('f_tuki1', ci.getMonth()+1);
    target.searchParams.set('f_hi1', ci.getDate());
    target.searchParams.set('f_nen2', co.getFullYear());
    target.searchParams.set('f_tuki2', co.getMonth()+1);
    target.searchParams.set('f_hi2', co.getDate());
    target.searchParams.set('f_otona_su', occupancy);
    target.searchParams.set('f_heya_su', 1);
    wrapUrl.searchParams.set('pc', target.toString());
    return wrapUrl.toString();
  } catch(e){ return base; }
}
function bookingLabel(){
  if(!stayDates.checkin || !stayDates.checkout) return '楽天トラベルで空室確認 ↗';
  const f = d => { const [y,m,day] = d.split('-'); return `${parseInt(m)}/${parseInt(day)}`; };
  return `${f(stayDates.checkin)}〜${f(stayDates.checkout)}の空室確認 ↗`;
}
function bookingLabelShort(){

  const f = d => { const [y,m,day] = d.split('-'); return `${parseInt(m)}/${parseInt(day)}`; };
  return `${f(stayDates.checkin)}〜${f(stayDates.checkout)} ↗`;

function togglePref(p){
  if(activePrefs.has(p)) activePrefs.delete(p); else activePrefs.add(p);
  renderPrefFilter();
  renderFeed();
}
function clearPrefs(){
  activePrefs.clear();
  renderPrefFilter();

}
document.addEventListener('click', (e) => {
  const wrap = document.getElementById('prefFilter');
  if(wrap && !wrap.contains(e.target)) closePrefPanel();

function renderPrefFilter(){
  const listEl = document.getElementById('prefPanelList');
  const btn = document.getElementById('prefFilterBtn');
  if(!listEl || !btn) return;

  const present = [...new Set(HOTELS.map(h => getPref(h.region)))]
    .sort((a,b) => PREF_ORDER.indexOf(a) - PREF_ORDER.indexOf(b));

  listEl.innerHTML = present.map(p => {
    const count = HOTELS.filter(h => getPref(h.region) === p).length;
    const checked = activePrefs.has(p);
    return `
      <div class="pref-item ${checked?'checked':''}" onclick="togglePref('${p}')">
        <span class="box"></span>
        <span>${p}</span>
        <span class="cnt">${count}件</span>
      </div>`;
  }).join('');

  if(activePrefs.size === 0){
    btn.textContent = '都道府県で絞り込み';
    btn.classList.remove('active');
  } else if(activePrefs.size === 1){
    btn.textContent = `${[...activePrefs][0]}`;
    btn.classList.add('active');
  } else {
    btn.textContent = `都道府県（${activePrefs.size}件選択中）`;
    btn.classList.add('active');
  }
}

// 外部画像を使わず、ホテルごとの色味からグラデーション「写真」を生成する
function grainDataUri(){
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(#n)' opacity='0.35'/></svg>`;
  return `url('data:image/svg+xml,${encodeURIComponent(svg)}')`;
}
const GRAIN_URI = grainDataUri();

function artStyle(hue, index, total){
  const h1 = (hue + index*9) % 360;
  const h2 = (hue + 34 + index*6) % 360;
  const light1 = 30 + (index % 3) * 6;
  const light2 = 14 + ((index+1) % 3) * 5;
  const angle = 120 + index*22;
  return `--grain:${GRAIN_URI}; background:` +
    `linear-gradient(${angle}deg, hsl(${h1} 46% ${light1}%), hsl(${h2} 40% ${light2}%));`;
}

// 楽天トラベルの画像CDN(trvimg.r10s.jp)の /origin/ 系パスは
// "?fit=inside|幅:高さ" というクエリでアスペクト比を保ったまま縮小リサイズを配信してくれる。
// このサイトのデータには「?fit=inside|2754:1548」のまま(=4Kクラスの原寸に近いサイズ)や
// 一切リサイズ指定のない生の原寸画像が多数含まれており、これが最大640px幅・
// 場合によっては120px幅のサムネイルとしてしか表示しない箇所でもそのまま読み込まれ、
// 画像読み込みが重くなる主因になっている。表示先の実サイズに応じて要求サイズを絞る。
function optimizeImgUrl(url, w, h){
  if(!url) return url;
  if(/^https:\/\/trvimg\.r10s\.jp\/.*\/origin\//.test(url)){
    const base = url.split('?')[0];
    return `${base}?fit=inside|${w}:${h}`;
  }
  return url;
}

function artHTML(h, index, caption, showIdx, sizeHint){
  const idxTag = showIdx ? `<span class="frame-idx">${String(index+1).padStart(2,'0')} / ${String(h.photos.length).padStart(2,'0')}</span>` : '';
  const realUrl = (index===0 && h.hero) ? h.hero : (h.photoUrls && h.photoUrls[index]);
  // full: カード一覧・モーダルの大きな写真枠(最大640px幅、2倍密度ディスプレイまで考慮)
  // thumb: 比較表・地図ポップアップ用の小さなサムネイル(最大120〜140px幅相当)
  const [tw, th] = sizeHint === 'thumb' ? [320, 220] : [1200, 800];
  const optUrl = optimizeImgUrl(realUrl, tw, th);
  const photoTag = optUrl
    ? `<img class="frame-photo" loading="lazy" decoding="async" alt="${h.name}" src="${optUrl}" onerror="this.remove()">`
    : '';
  return `<div class="frame-art" style="${artStyle(h.hue, index, h.photos.length)}">
      ${photoTag}
      <span class="frame-cap mono">${caption}</span>${idxTag}
    </div>`;
}

function yen(n){ return (n===null || n===undefined) ? '要問合せ' : '¥' + n.toLocaleString('ja-JP'); }

function parseCoord(str){
  const m = str.match(/(-?\d+\.?\d*)°\s*([NS]),\s*(-?\d+\.?\d*)°\s*([EW])/);
  if(!m) return null;
  const lat = parseFloat(m[1]) * (m[2]==='S' ? -1 : 1);
  const lng = parseFloat(m[3]) * (m[4]==='W' ? -1 : 1);
  return { lat, lng };
}
function dash(v, unit){ return (v===null || v===undefined) ? '-' : v + (unit||''); }

// ボタンを連続で素早く押しても確実に1枚ずつ進めるための処理。
// scrollBy（現在位置からの相対移動）だと、スムーズスクロールのアニメーション中に
// 次のクリックが来た際、ブラウザによっては「アニメーション途中の位置」を基準に
// 計算してしまい、連打してもほとんど進まない・反応が遅れることがある。
// そこで「今どのカードへ向かっているか（目標インデックス）」自体をギャラリーごとに
// 記憶しておき、クリックのたびにその目標インデックスを1つずつ進める／戻すことで、
// 連打分がすべて正しく反映されるようにする。
function galleryFrames(gallery){ return Array.from(gallery.querySelectorAll('.frame')); }

function galleryNearestIndex(gallery, list){
  const sl = gallery.scrollLeft;
  let best = 0, bestDist = Infinity;
  list.forEach((f, i) => {
    const d = Math.abs(f.offsetLeft - sl);
    if(d < bestDist){ bestDist = d; best = i; }
  });
  return best;
}

function scrollGallery(btn, dir){
  const wrap = btn.closest('.gallery-wrap');
  const gallery = wrap.querySelector('.gallery');
  const list = galleryFrames(gallery);
  if(!list.length) return;
  const current = gallery.dataset.targetIndex !== undefined
    ? parseInt(gallery.dataset.targetIndex, 10)
    : galleryNearestIndex(gallery, list);
  const target = Math.max(0, Math.min(list.length - 1, current + dir));
  gallery.dataset.targetIndex = String(target);
  gallery.scrollTo({ left: list[target].offsetLeft, behavior: 'smooth' });
}

// ---------- ギャラリーのスワイプ操作 ----------
// ネイティブのスクロール（勢いで複数枚飛ばされてしまう）に任せず、
// 指の動きを直接追いかけて、指を離した時に必ず「前後1枚」だけ移動するようにする。
(function initGallerySwipe(){
  let drag = null;

  function frames(gallery){ return Array.from(gallery.querySelectorAll('.frame')); }

  function nearestIndex(gallery){
    const list = frames(gallery);
    const sl = gallery.scrollLeft;
    let best = 0, bestDist = Infinity;
    list.forEach((f, i) => {
      const d = Math.abs(f.offsetLeft - sl);
      if(d < bestDist){ bestDist = d; best = i; }
    });
    return best;
  }

  function goToIndex(gallery, index){
    const list = frames(gallery);
    if(!list.length) return;
    const clamped = Math.max(0, Math.min(list.length - 1, index));
    gallery.dataset.targetIndex = String(clamped); // 矢印ボタンの連打処理と目標位置を同期させる
    gallery.scrollTo({ left: list[clamped].offsetLeft, behavior: 'smooth' });
  }

  document.addEventListener('touchstart', function(e){
    const gallery = e.target.closest('.gallery');
    if(!gallery) return;
    const t = e.touches[0];
    drag = {
      gallery,
      startX: t.clientX,
      startY: t.clientY,
      startScrollLeft: gallery.scrollLeft,
      startIndex: nearestIndex(gallery),
      axis: null,
      lastDx: 0,
    };
  }, { passive:true });

  document.addEventListener('touchmove', function(e){
    if(!drag) return;
    const t = e.touches[0];
    const dx = t.clientX - drag.startX;
    const dy = t.clientY - drag.startY;
    if(drag.axis === null && (Math.abs(dx) > 6 || Math.abs(dy) > 6)){
      drag.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    }
    if(drag.axis === 'x'){
      e.preventDefault(); // 横方向の指の動きは、こちらで完全に制御する
      drag.gallery.scrollLeft = drag.startScrollLeft - dx;
      drag.lastDx = dx;
    } else if(drag.axis === 'y'){
      drag = null; // 縦スクロールの意図なら、通常のページスクロールに任せる
    }
  }, { passive:false });

  function finishDrag(){
    if(!drag || drag.axis !== 'x'){ drag = null; return; }
    const { gallery, startIndex, lastDx } = drag;
    const threshold = 30; // px。これ未満の動きは「めくらなかった」扱いで元の位置に戻す
    let target = startIndex;
    if(lastDx <= -threshold) target = startIndex + 1;
    else if(lastDx >= threshold) target = startIndex - 1;
    goToIndex(gallery, target);
    drag = null;
  }
  document.addEventListener('touchend', finishDrag, { passive:true });
  document.addEventListener('touchcancel', function(){ drag = null; }, { passive:true });
})();

// 検索中（空室確認中）は数百ms〜1秒間隔でrenderFeed()が繰り返し呼ばれる。
// 以前はそのたびにカード一覧のDOMをまるごと作り直していたため、
// ・写真ギャラリーのスクロール位置がリセットされる
// ・ページ全体がレイアウトし直され、下にスクロールしている最中に
// 　引っかかったり、位置が戻されたりする（カクつき）
// という問題が起きていた。
// 今は「対象外になったホテルのカードだけを取り除き、残るカードの要素自体は
// 作り直さない」差分更新にすることで、ギャラリーの状態やスクロール位置を
// 保ったまま、変化のあった部分だけを軽く更新するようにしている。
function renderFeed(){
  const hasStay = !!(stayDates.checkin && stayDates.checkout);
  const list = HOTELS.filter(h =>
    (activeTag==='すべて' || (h.category && h.category.includes(activeTag))) &&
    (activePrefs.size===0 || activePrefs.has(getPref(h.region)))
  ).filter(h => {
    if(!hasStay) return true;
    const hotelNo = extractHotelNo(h);
    if(!hotelNo) return true; // 施設番号が特定できないホテルは判定できないため表示は残す
    const status = availabilityCache[availabilityKey(hotelNo)];
    return status !== false && status !== null; // 空室なし確定・確認エラーの両方を非表示（未取得中・未検索は表示しつつ確認継続）
  });
  let loadingHtml = '';
  if(hasStay && availabilityLoading){
    loadingHtml = `<p class="stay-loading">この期間・人数で空室のあるホテルを確認中… 空室なしと確認できたホテルから順に一覧から外れます。</p>`;
  }
  let errorBannerHtml = '';
  if(hasStay && !availabilityLoading && allChecksFailed){
    errorBannerHtml = `<div class="api-error-banner">
      <strong>この日程の料金・空室確認ができませんでした。</strong>
      検索したホテルすべてで確認に失敗しています。楽天トラベルAPIの設定（アプリケーションID等）に問題がある可能性があります。下に表示されている金額はすべて目安料金です。
      ${lastApiError ? `<div class="api-error-detail">サーバーからの応答: ${lastApiError}</div>` : ''}
    </div>`;
  }

  const container = document.getElementById('cardList');

  // 確認中・エラーのバナーは専用のプレースホルダだけを更新する
  let bannerEl = container.querySelector(':scope > .feed-banners');
  if(!bannerEl){
    bannerEl = document.createElement('div');
    bannerEl.className = 'feed-banners';
    container.prepend(bannerEl);
  }
  const bannerHtml = errorBannerHtml + loadingHtml;
  if(bannerEl.innerHTML !== bannerHtml) bannerEl.innerHTML = bannerHtml;

  // 既存カードをホテルIDで引けるようにしておく
  const existing = new Map();
  container.querySelectorAll(':scope > .card[data-hotel-id]').forEach(el => existing.set(el.dataset.hotelId, el));

  let cursor = bannerEl.nextSibling;
  list.forEach(h => {
    let el = existing.get(h.id);
    if(el){
      existing.delete(h.id);
      updateCardDynamic(el, h); // 既にDOMにあるカードは作り直さず、お気に入り・料金など変化しうる部分だけ更新
    } else {
      const tmp = document.createElement('div');
      tmp.innerHTML = cardHTML(h).trim();
      el = tmp.firstElementChild;
    }
    if(cursor !== el) container.insertBefore(el, cursor);
    cursor = el.nextSibling;
  });

  // 一覧から外れたホテル（空室なし判定・タグ絞り込み変更など）のカードだけを取り除く
  existing.forEach(el => el.remove());
}

// 既存カードのうち、検索条件やお気に入り状態によって変わりうる部分だけを更新する。
// 写真ギャラリー・名前・タグなど静的な部分には触れないため、スクロール位置や
// レイアウトはそのまま保たれる。
function updateCardDynamic(el, h){
  const isFav = favorites.has(h.id);
  const stamp = el.querySelector('.stamp');
  if(stamp) stamp.classList.toggle('active', isFav);

  const priceEl = el.querySelector('.price');
  if(priceEl){
    priceEl.innerHTML = `${yen(getDisplayPrice(h))}<span class="from price-status status-${priceStatus(h)}">${priceStatusLabel(h)}</span>`;
  }

  const ratingB = el.querySelector('.rating b');
  if(ratingB) ratingB.textContent = dash(h.rating);

  const bookLink = el.querySelector('.book-link');
  if(bookLink) bookLink.setAttribute('href', buildBookingUrl(h));

  // 裏側の自動収集（syncLiveData）で代表写真が更新された場合のみ、1枚目の画像を差し替える
  const heroImg = el.querySelector('.frame-photo');
  if(heroImg && h.hero){
    const optUrl = optimizeImgUrl(h.hero, 1200, 800);
    if(heroImg.getAttribute('src') !== optUrl) heroImg.setAttribute('src', optUrl);
  }
}

let favMapInstance = null;
let favMapMarkers = null;
let favMapPoints = [];

function renderMapPage(){
  const list = HOTELS.filter(h => favorites.has(h.id));
  const wrap = document.getElementById('mapPage');

  if(list.length===0){
    if(favMapInstance){ favMapInstance.remove(); favMapInstance = null; favMapMarkers = null; }
    favMapPoints = [];
    wrap.innerHTML = `
      <div class="compare-head">
        <h1 class="serif">地図で見る</h1>
        <p>お気に入りに登録したホテルを、1つの地図の上でまとめて確認できます。ホーム画面でいいねを選択すると、地図に追加されます。</p>
      </div>
      <div class="empty">
        <div class="ico">◇</div>
        <p>まだお気に入りがありません。気になるホテルの<br class="br">スタンプボタンを押して追加してください。</p>
        <button onclick="switchTab('feed')">ホームへ戻る</button>
      </div>`;
    return;
  }

  // 地図コンテナが無ければ作る（初回、またはリストが空から復帰した直後）
  if(!document.getElementById('favMap')){
    wrap.innerHTML = `
      <div class="compare-head">
        <h1 class="serif">地図で見る</h1>
        <p>${list.length}件のホテルを地図上に表示しています。ピンをタップすると詳細が見られます。ホーム画面でいいねを選択すると、地図に追加されます。</p>
      </div>
      <div class="map-canvas-wrap">
        <div id="favMap"></div>
        <svg id="mapLeaderLines" class="map-leader-svg"></svg>
        <div id="mapLabels" class="map-labels-layer"></div>
      </div>`;
    if(favMapInstance){ favMapInstance.remove(); favMapInstance = null; favMapMarkers = null; }
  } else {
    // 件数表示だけ更新
    const pEl = wrap.querySelector('.compare-head p');
    if(pEl) pEl.textContent = `${list.length}件のホテルを地図上に表示しています。ピンをタップすると詳細が見られます。ホーム画面でいいねを選択すると、地図に追加されます。`;
  }

  const points = list
    .map(h => ({ h, p: parseCoord(h.coord) }))
    .filter(x => x.p);

  if(!favMapInstance){
    favMapInstance = L.map('favMap', { scrollWheelZoom:false });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 18
    }).addTo(favMapInstance);
    favMapMarkers = L.layerGroup().addTo(favMapInstance);
    favMapInstance.on('move zoom', () => layoutFavMapLabels(favMapPoints));
    window.addEventListener('resize', () => {
      if(!favMapInstance) return;
      favMapInstance.invalidateSize();
      layoutFavMapLabels(favMapPoints);
    });
  } else {
    favMapMarkers.clearLayers();
  }

  const pinIcon = L.divIcon({
    className: 'fav-pin',
    html: '<div class="fav-pin-dot"></div>',
    iconSize: [16,16],
    iconAnchor: [8,16]
  });

  points.forEach(({h, p}) => {
    const marker = L.marker([p.lat, p.lng], { icon: pinIcon }).addTo(favMapMarkers);
    const photo = optimizeImgUrl(h.hero || '', 320, 220);
    const popupHtml = `
      <div class="map-pop">
        <div class="map-pop-photo" style="${artStyle(h.hue, 0, h.photos.length)}">
          ${photo ? `<img loading="lazy" decoding="async" alt="${h.name}" src="${photo}" onerror="this.remove()">` : ''}
        </div>
        <div class="map-pop-body">
          <div class="map-pop-name" onclick="closeMapPopupAndOpen('${h.id}')">${h.name}</div>
          <div class="map-pop-loc">${h.region}</div>
          <div class="map-pop-price">${yen(getDisplayPrice(h))}<span class="price-status status-${priceStatus(h)}" style="font-size:10px;"> ${priceStatusLabel(h)}</span></div>
        </div>
      </div>`;
    marker.bindPopup(popupHtml);
  });

  favMapPoints = points;

  if(points.length){
    const bounds = L.latLngBounds(points.map(x => [x.p.lat, x.p.lng]));
    favMapInstance.fitBounds(bounds, { paddingTopLeft:[40,60], paddingBottomRight:[40,40], maxZoom:11 });
  }
  layoutFavMapLabels(favMapPoints);

  // display:noneから表示に切り替わった直後はサイズ計算がずれるため、次フレームで補正
  setTimeout(() => {
    if(!favMapInstance) return;
    favMapInstance.invalidateSize();
    layoutFavMapLabels(favMapPoints);
  }, 50);
}

// ピンから地図の外側(左右の余白)へ引き出し線でホテル名ラベルを配置し、
// 日本地図の上になるべく文字が乗らないようにする
function layoutFavMapLabels(points){
  const svg = document.getElementById('mapLeaderLines');
  const labelsLayer = document.getElementById('mapLabels');
  if(!svg || !labelsLayer || !favMapInstance) return;

  const rect = favMapInstance.getContainer().getBoundingClientRect();
  const W = rect.width, H = rect.height;
  if(!W || !H) return;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = '';
  labelsLayer.innerHTML = '';

  const pts = points.map(({h, p}) => {
    const cp = favMapInstance.latLngToContainerPoint(L.latLng(p.lat, p.lng));
    return { h, x: cp.x, y: cp.y };
  });

  const leftPts = pts.filter(pt => pt.x < W/2).sort((a,b)=>a.y-b.y);
  const rightPts = pts.filter(pt => pt.x >= W/2).sort((a,b)=>a.y-b.y);

  const MIN_GAP = 28;
  function assignSlots(list){
    let lastY = -Infinity;
    list.forEach(pt => {
      pt.slotY = Math.max(pt.y, lastY + MIN_GAP);
      lastY = pt.slotY;
    });
    if(list.length){
      const overflow = list[list.length-1].slotY - (H - 16);
      if(overflow > 0) list.forEach(pt => pt.slotY -= overflow);
    }
    list.forEach(pt => { pt.slotY = Math.max(16, pt.slotY); });
  }
  assignSlots(leftPts);
  assignSlots(rightPts);

  const MARGIN = 34;
  function renderSide(list, side){
    list.forEach(pt => {
      const label = document.createElement('div');
      label.className = `map-pin-label side-${side}`;
      label.textContent = pt.h.name;
      label.style.top = pt.slotY + 'px';
      label.onclick = () => closeMapPopupAndOpen(pt.h.id);
      labelsLayer.appendChild(label);

      const w = label.offsetWidth;
      const anchorX = side === 'left' ? (MARGIN + w) : (W - MARGIN - w);
      const midX = (anchorX + pt.x) / 2;
      const line = document.createElementNS('http://www.w3.org/2000/svg','path');
      line.setAttribute('d', `M ${pt.x} ${pt.y} L ${midX} ${pt.slotY} L ${anchorX} ${pt.slotY}`);
      line.setAttribute('class', 'map-leader-line');
      svg.appendChild(line);
    });
  }
  renderSide(leftPts, 'left');
  renderSide(rightPts, 'right');
}

function closeMapPopupAndOpen(id){
  if(favMapInstance) favMapInstance.closePopup();
  openModal(id);
}

// 起動時に、裏側で自動収集された最新データ（価格・評価・代表写真）を取得して上書きする。
// 失敗しても、あらかじめ埋め込まれているデータでそのまま表示され続けるので安全。
(async function syncLiveData(){
  try {
    const res = await fetch('/.netlify/functions/get-hotels');
    if(!res.ok) return;
    const data = await res.json();
    if(!data || !data.hotels) return;
    let changed = false;
    HOTELS.forEach(h => {
      const live = data.hotels[h.id];
      if(!live || live.error) return;
      if(typeof live.price === 'number') h.price = live.price;
      if(typeof live.rating === 'number') h.rating = Math.round(live.rating*10)/10;
      if(live.hero) h.hero = live.hero;
      if(live.access) h.access = live.access;
      changed = true;
    });
    if(changed){ renderFeed(); }
  } catch(err){
    // ネットワークエラー等は無視し、埋め込みデータのまま表示を続ける
    console.warn('live data sync skipped:', err);
  }
})();
</script>
